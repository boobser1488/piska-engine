# Linux: пакеты. `base` — нужно скриптам (скачать, распаковать); `build` — собрать движок;
# `run` — запускать (Vulkan, X11 / Wayland); `cpp`, `jdk` — компоненты cpp и android.
# Источник: docs/api/export.md §10.1 и .github/workflows/build.yml.
[linux.debian]
ids = ["debian", "ubuntu", "linuxmint", "pop", "raspbian", "neon", "elementary"]
update = "apt-get update"
install = "apt-get install -y"
base = ["ca-certificates", "curl", "git", "unzip", "xz-utils"]
build = ["build-essential", "pkg-config", "libasound2-dev", "libudev-dev"]
run = ["mesa-vulkan-drivers", "libvulkan1", "libxkbcommon0", "libwayland-client0", "libx11-6"]
cpp = ["cmake", "ninja-build"]
jdk = ["openjdk-17-jdk-headless"]

[linux.fedora]
ids = ["fedora", "rhel", "centos", "rocky", "almalinux", "nobara"]
update = "true"
install = "dnf install -y"
base = ["ca-certificates", "curl", "git", "unzip", "xz"]
build = ["gcc", "gcc-c++", "pkgconf-pkg-config", "alsa-lib-devel", "systemd-devel"]
run = ["mesa-vulkan-drivers", "vulkan-loader", "libxkbcommon", "libwayland-client", "libX11"]
cpp = ["cmake", "ninja-build"]
jdk = ["java-17-openjdk-devel"]

[linux.arch]
ids = ["arch", "manjaro", "endeavouros", "garuda", "cachyos"]
update = "pacman -Sy"
install = "pacman -S --needed --noconfirm"
base = ["ca-certificates", "curl", "git", "unzip", "xz"]
build = ["base-devel", "pkgconf", "alsa-lib", "systemd-libs"]
run = ["vulkan-icd-loader", "vulkan-radeon", "libxkbcommon", "wayland", "libx11"]
cpp = ["cmake", "ninja"]
jdk = ["jdk17-openjdk"]

[linux.suse]
ids = ["opensuse-leap", "opensuse-tumbleweed", "opensuse", "sles", "suse"]
update = "true"
install = "zypper --non-interactive install"
base = ["ca-certificates", "curl", "git", "unzip", "xz"]
build = ["gcc", "gcc-c++", "pkgconf-pkg-config", "alsa-devel", "systemd-devel"]
run = ["libvulkan1", "Mesa-vulkan-device-select", "libxkbcommon0", "libwayland-client0", "libX11-6"]
cpp = ["cmake", "ninja"]
jdk = ["java-17-openjdk-devel"]

# macOS: Homebrew. Компилятор — Xcode Command Line Tools (xcode-select --install).
[macos]
update = "true"
install = "brew install"
install_cask = "brew install --cask"
base = ["git", "curl", "unzip", "xz"]
build = ["pkg-config"]
run = []
cpp = ["cmake", "ninja"]
jdk_cask = ["temurin@17"]
