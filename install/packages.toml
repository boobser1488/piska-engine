# Единственный источник версий, ссылок, контрольных сумм и списков пакетов для
# установщиков (install.ps1, install.sh), `piska-export doctor` (вшит через include_str!),
# docs/install.md и тестов install/tests.
#
# Формат — ограниченное подмножество TOML, которое читают и PowerShell, и bash (awk), и
# крейт `toml`: заголовки `[раздел]` / `[раздел.подраздел]`, строки `ключ = "значение"`,
# целые числа и однострочные массивы строк `ключ = ["a", "b"]`. Комментарии — только
# отдельными строками. Никаких многострочных значений.
#
# pin_status = "to-verify-in-ci": сумма переписана со страницы издателя без возможности
# проверить офлайн; install/tests/verify-pins.sh (CI) сверяет её со страницей / index.json.
#
# Контрольные суммы: `sha256` — зафиксированная здесь (сверена с страницей издателя при
# написании; перед выпуском сверьте заново); `sha256_url` — файл издателя с суммой,
# скачиваемый по TLS вместе с файлом. Файл без одной из двух проверок установщик не
# запускает (это проверяет install/tests).

[project]
repo = "https://github.com/boobser1488/piska-engine.git"
# Сырой URL каталога install/ — работает, только когда репозиторий публичный (сейчас он приватный).
raw_base = "https://raw.githubusercontent.com/boobser1488/piska-engine/main/install"
branch = "main"
install_dir_name = "PiskaEngine"
state_dir_name = "PiskaEngine"
# Собираемые программы основного рабочего пространства; модельер — отдельное рабочее
# пространство (подмодуль git) в modeler/ и собирается через --manifest-path.
binaries = ["piska-hub", "piska-editor", "piska-export"]
modeler_manifest = "modeler/Cargo.toml"
modeler_binary = "piska-modeler"
# Файл проекта: расширение и описание для ассоциации файлов — те же, что в `engine_i18n::brand`
# (PROJECT_EXTENSION, PROJECT_FILE_DESCRIPTION; это проверяет тест графического установщика).
project_extension = "pks"
project_file_description = "Piska project source"

# Минимальные версии: по ним doctor решает «старая версия».
[min]
rust = "1.86"
cmake = "3.20"
ninja = "1.10"
git = "2.30"
java = "11"
zig = "0.13"
ndk_major = "23"
android_api = "26"
gpp = "9"

[rust]
toolchain = "stable"
windows_host = "x86_64-pc-windows-msvc"
components = ["clippy", "rustfmt"]
rustup_init_windows_url = "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe"
rustup_init_windows_sha256_url = "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe.sha256"
# Скрипт rustup на Linux / macOS: скачивается в файл, проверяется и только потом запускается.
rustup_init_linux_x86_64_url = "https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init"
rustup_init_linux_aarch64_url = "https://static.rust-lang.org/rustup/dist/aarch64-unknown-linux-gnu/rustup-init"
rustup_init_macos_x86_64_url = "https://static.rust-lang.org/rustup/dist/x86_64-apple-darwin/rustup-init"
rustup_init_macos_aarch64_url = "https://static.rust-lang.org/rustup/dist/aarch64-apple-darwin/rustup-init"
web_target = "wasm32-unknown-unknown"
android_targets = ["aarch64-linux-android"]
linux_target = "x86_64-unknown-linux-gnu"

# winget-пакеты Windows.
[winget]
git = "Git.Git"
buildtools = "Microsoft.VisualStudio.2022.BuildTools"
cmake = "Kitware.CMake"
ninja = "Ninja-build.Ninja"
jdk = "EclipseAdoptium.Temurin.17.JDK"
# Параметры установщика Visual Studio (переданы в --override).
vs_workloads = ["Microsoft.VisualStudio.Workload.VCTools", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "Microsoft.VisualStudio.Component.Windows11SDK.22621"]
vs_required_component = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"

